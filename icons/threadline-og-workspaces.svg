<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Threadline Workspaces</title>
  <desc id="desc">Sachliche Open-Graph-Grafik mit Threadline-Logo und vier Workspaces: Composer, Archiv-Funktion, Netzwerk und DM-Archiv.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9fcff"/>
      <stop offset="55%" stop-color="#e7f2ff"/>
      <stop offset="100%" stop-color="#d7ebff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f9ff"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5adfca"/>
      <stop offset="100%" stop-color="#1bb6a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#89a8d4" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#84a8d8" flood-opacity=".12"/>
    </filter>
    <style>
      .eyebrow { font: 700 15px/1.2 Arial, sans-serif; letter-spacing: 2.8px; text-transform: uppercase; fill: #4dc9bb; }
      .title { font: 700 56px/1.05 Arial, sans-serif; fill: #203454; }
      .subtitle { font: 400 24px/1.45 Arial, sans-serif; fill: #5d79a5; }
      .card-title { font: 700 26px/1.15 Arial, sans-serif; fill: #203454; }
      .card-text { font: 400 19px/1.45 Arial, sans-serif; fill: #6582ab; }
      .label { font: 700 18px/1 Arial, sans-serif; fill: #203454; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="106" r="168" fill="#ffffff" fill-opacity=".18"/>
  <circle cx="104" cy="560" r="140" fill="#ffffff" fill-opacity=".14"/>
  <path d="M0 520C180 464 277 510 445 482C662 446 782 333 1200 389V630H0Z" fill="#ffffff" fill-opacity=".18"/>

  <g transform="translate(76 72)">
    <rect width="164" height="164" rx="42" fill="url(#bg)" filter="url(#shadow)"/>
    <circle cx="82" cy="82" r="52.5" fill="none" stroke="#7ba9e7" stroke-opacity=".28" stroke-width="4"/>
    <path d="M48 77c0-18.3 14.9-33.2 33.2-33.2h16.6c9.2 0 16.6 7.4 16.6 16.6S107 77 97.8 77H72.2c-9.2 0-16.6 7.4-16.6 16.6s7.4 16.6 16.6 16.6H114" fill="none" stroke="url(#thread)" stroke-linecap="round" stroke-width="11.5"/>
    <circle cx="97.8" cy="60.4" r="13.4" fill="#ffffff" stroke="#72b9f2" stroke-width="5.8"/>
    <circle cx="72.2" cy="93.6" r="13.4" fill="#ffffff" stroke="#72b9f2" stroke-width="5.8"/>
    <circle cx="99.2" cy="110" r="15.4" fill="#ffffff" stroke="#1bb6a0" stroke-width="5.8"/>
    <path d="M40.4 51c6.4-6 13.8-9 22-9" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-linecap="round" stroke-width="3.8"/>
  </g>

  <g transform="translate(286 86)">
    <text class="eyebrow" x="0" y="0">THREADLINE</text>
    <text class="title" x="0" y="68">Vier Arbeitsbereiche für Bluesky</text>
    <text class="subtitle" x="0" y="118">Schreiben, sichern, erkunden und Direct Messages lokal verwalten.</text>
  </g>

  <g transform="translate(76 272)">
    <g transform="translate(0 0)" filter="url(#soft)">
      <rect width="492" height="118" rx="28" fill="url(#panel)"/>
      <circle cx="52" cy="44" r="28" fill="#f2fcfa" stroke="#9ce5da" stroke-width="2.2"/>
      <g transform="translate(52 48) rotate(-45) translate(-52 -48)">
        <rect x="42.5" y="36.5" width="19" height="9" rx="4.2" fill="none" stroke="#16a795" stroke-width="3.6"/>
        <rect x="58.5" y="36.5" width="8.5" height="9" rx="3.2" fill="none" stroke="#16a795" stroke-width="3.6"/>
        <path d="M42.5 36.5l-6.5 4.5 6.5 4.5" fill="none" stroke="#16a795" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path d="M40.5 60.5h23" fill="none" stroke="#16a795" stroke-width="3.6" stroke-linecap="round"/>
      <text class="card-title" x="92" y="50">Composer</text>
      <text class="card-text" x="92" y="86">Threads entwerfen und Bilder zufügen</text>
    </g>

    <g transform="translate(0 136)" filter="url(#soft)">
      <rect width="492" height="118" rx="28" fill="url(#panel)"/>
      <circle cx="52" cy="44" r="28" fill="#f5f9ff" stroke="#bfd8f6" stroke-width="2.2"/>
      <path d="M36 39c0-3.3 2.7-6 6-6h20c3.3 0 6 2.7 6 6v20c0 3.3-2.7 6-6 6H42c-3.3 0-6-2.7-6-6V39Zm4 6h24M48 54h8" fill="none" stroke="#2d84df" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="card-title" x="92" y="50">Archiv-Funktion</text>
      <text class="card-text" x="92" y="86">Posts, Medien und Exporte sichern</text>
    </g>

    <g transform="translate(556 0)" filter="url(#soft)">
      <rect width="492" height="118" rx="28" fill="url(#panel)"/>
      <circle cx="52" cy="44" r="28" fill="#f5f9ff" stroke="#bfd8f6" stroke-width="2.2"/>
      <circle cx="52" cy="28" r="7" fill="#ffffff" stroke="#2d84df" stroke-width="3.6"/>
      <circle cx="36" cy="54" r="7" fill="#ffffff" stroke="#2d84df" stroke-width="3.6"/>
      <circle cx="68" cy="54" r="7" fill="#ffffff" stroke="#2d84df" stroke-width="3.6"/>
      <path d="M46.1 34.1 40.2 47.6M57.9 34.1 63.8 47.6M43.8 54h16.4" fill="none" stroke="#2d84df" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="card-title" x="92" y="50">Netzwerk</text>
      <text class="card-text" x="92" y="86">Follower, Following und Mutuals erkunden</text>
    </g>

    <g transform="translate(556 136)" filter="url(#soft)">
      <rect width="492" height="118" rx="28" fill="url(#panel)"/>
      <circle cx="52" cy="44" r="28" fill="#f2fcfa" stroke="#9ce5da" stroke-width="2.2"/>
      <path d="M42 31h20c5 0 9 4 9 9v11c0 5-4 9-9 9H54l-8 8v-8h-4c-5 0-9-4-9-9V40c0-5 4-9 9-9Z" fill="none" stroke="#16a795" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46" cy="45.5" r="2.2" fill="#16a795"/>
      <circle cx="52" cy="45.5" r="2.2" fill="#16a795"/>
      <circle cx="58" cy="45.5" r="2.2" fill="#16a795"/>
      <text class="card-title" x="92" y="50">DM-Archiv</text>
      <text class="card-text" x="92" y="86">Direct Messages lokal laden und sichern</text>
    </g>
  </g>

</svg>
