  <text x="56" y="78" fill="#15304B" font-family="Arial, sans-serif" font-size="30" font-weight="700">Continue thread</text>
  <text x="56" y="112" fill="#4F6B8A" font-family="Arial, sans-serif" font-size="18">The new post attaches to your latest own segment.</text>
  <text x="588" y="78" fill="#15304B" font-family="Arial, sans-serif" font-size="30" font-weight="700">Reply to post</text>
  <text x="588" y="112" fill="#4F6B8A" font-family="Arial, sans-serif" font-size="18">The new post replies to the exact URL target.</text>

