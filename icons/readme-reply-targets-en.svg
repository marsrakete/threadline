  <text x="588" y="326" fill="#4F6B8A" font-family="Arial, sans-serif" font-size="16">Here, reply.parent points directly at the post from the supplied URL.</text>

  <rect x="588" y="360" width="418" height="84" rx="18" fill="#F8FBFF" stroke="#D7E3F1"/>
  <text x="616" y="392" fill="#15304B" font-family="Arial, sans-serif" font-size="18" font-weight="700">Quick rule</text>
  <text x="616" y="420" fill="#4F6B8A" font-family="Arial, sans-serif" font-size="16">Continue = attach to your latest own post in that thread.</text>
  <text x="616" y="444" fill="#4F6B8A" font-family="Arial, sans-serif" font-size="16">Reply = attach to the exact post from the URL.</text>
